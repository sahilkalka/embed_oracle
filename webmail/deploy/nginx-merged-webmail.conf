# /etc/nginx/sites-available/mail.embeddedindia.in.conf
# ==============================================================================
# Dual-Webmail Architecture:
# 1. Primary: Modern Fluid Webmail (Node.js Port 3005) at https://mail.embeddedindia.in/
# 2. Backup: Existing Webmail & Roundcube preserved at:
#    - Subdomain: https://backup-mail.embeddedindia.in/
#    - Subpath:   https://mail.embeddedindia.in/legacy-rc/
# 3. ActiveSync & CalDAV: Untouched for phones/SOGo sync (127.0.0.1:8088)
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name mail.embeddedindia.in backup-mail.embeddedindia.in autodiscover.embeddedindia.in autoconfig.embeddedindia.in mta-sts.embeddedindia.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 1. PRIMARY: Modern Fluid Webmail (mail.embeddedindia.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.embeddedindia.in autodiscover.embeddedindia.in autoconfig.embeddedindia.in mta-sts.embeddedindia.in;

    ssl_certificate /etc/letsencrypt/live/mail.embeddedindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.embeddedindia.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:MailSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Keep ActiveSync Long-Polling & Push for Mobile Phones (SOGo)
    location /Microsoft-Server-ActiveSync {
        proxy_pass http://127.0.0.1:8088/Microsoft-Server-ActiveSync;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Keep Calendar & Contacts Sync (CalDAV/CardDAV for SOGo)
    location /dav/ {
        proxy_pass http://127.0.0.1:8088/SOGo/dav/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /SOGo/dav/ {
        proxy_pass http://127.0.0.1:8088/SOGo/dav/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backup Path: Access existing Roundcube directly at https://mail.embeddedindia.in/legacy-rc/
    location /legacy-rc/ {
        proxy_pass http://127.0.0.1:8088/rc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /rc/ /legacy-rc/;
    }

    # Real-Time SSE Stream for Instant Push
    location /api/realtime {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Static Assets for Modern Webmail
    location ~* ^/(assets|favicon\.svg)/ {
        root /var/www/embeddedindia/webmail/server/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri @node_webmail;
    }

    # Primary Modern Webmail Routing
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @node_webmail {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKUP SUBDOMAIN: Existing Roundcube Webmail (backup-mail.embeddedindia.in)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backup-mail.embeddedindia.in;

    ssl_certificate /etc/letsencrypt/live/mail.embeddedindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.embeddedindia.in/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8088/rc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path /rc/ /;
    }
}
