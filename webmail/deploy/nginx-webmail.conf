# /etc/nginx/sites-available/webmail
# Reverse Proxy configuration for Modern Fluid Webmail on Oracle Cloud Server

upstream webmail_backend {
    server 127.0.0.1:3005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.embeddedindia.in webmail.embeddedindia.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.embeddedindia.in webmail.embeddedindia.in;

    # SSL Certificates (Cloudflare Origin Certificate or Let's Encrypt)
    ssl_certificate /etc/ssl/embeddedindia/origin.crt;
    ssl_certificate_key /etc/ssl/embeddedindia/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Offload Static Client Assets with Long Cache
    location ~* ^/(assets|favicon\.svg)/ {
        root /var/www/webmail/server/public;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri @node_webmail;
    }

    # Real-Time SSE Endpoint (Server-Sent Events) - Disable buffering
    location /api/realtime {
        proxy_pass http://webmail_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE instant delivery
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # All API & Webmail Application Traffic
    location / {
        proxy_pass http://webmail_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @node_webmail {
        proxy_pass http://webmail_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
