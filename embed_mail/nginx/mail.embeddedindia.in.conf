# ==============================================================================
# Host Nginx Virtual Host for Mail Server & SOGo ActiveSync
# Domains: mail.embeddedindia.in, autodiscover.embeddedindia.in, autoconfig.embeddedindia.in
# Proxies to Mailcow internal frontend at 127.0.0.1:8080 (HTTP) / 8443 (HTTPS)
# ==============================================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mail.embeddedindia.in autodiscover.embeddedindia.in autoconfig.embeddedindia.in mta-sts.embeddedindia.in;

    # Allow Let's Encrypt / Certbot challenge if needed
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main Mail & ActiveSync Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.embeddedindia.in autodiscover.embeddedindia.in autoconfig.embeddedindia.in mta-sts.embeddedindia.in;

    # SSL Certificates (managed via Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/mail.embeddedindia.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.embeddedindia.in/privkey.pem;

    # Fallback to local origin cert if certbot has not yet run
    # ssl_certificate /etc/ssl/embeddedindia/origin.crt;
    # ssl_certificate_key /etc/ssl/embeddedindia/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:MailSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    # Microsoft Exchange ActiveSync (EAS) Long-Polling & Push Email for Outlook & Mobile
    location /Microsoft-Server-ActiveSync {
        proxy_pass http://127.0.0.1:8088/Microsoft-Server-ActiveSync;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Extended timeouts for ActiveSync Ping / Push (1 hour)
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_buffering off;
    }

    # Thunderbird-style autoconfig: our own file (only encrypted, reachable ports; branded).
    # Must come before the generic autodiscover regex below.
    location ~* ^/(\.well-known/autoconfig/)?mail/config-v1\.1\.xml$ {
        root /var/www/embeddedindia/embed_mail/nginx/autoconfig;
        default_type "application/xml; charset=utf-8";
        try_files /config-v1.1.xml =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Outlook & Thunderbird Auto-Configuration
    location ~* ^/(Autodiscover|autodiscover|mail|email)/[a-zA-Z0-9_\-.]+\.(xml|json) {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Old webmail/admin URLs on this host
    location ~ ^/(mail|webmail|rc)/?$ {
        return 301 https://$host/;
    }
    location = /admin {
        return 301 https://embeddedindia.in/admin/email;
    }
    location = /admin/ {
        return 301 https://embeddedindia.in/admin/email;
    }

    # MTA-STS policy (RFC 8461). Starts in "testing" mode; switch to "enforce" once
    # TLS-RPT reports are clean. Served for https://mta-sts.embeddedindia.in/.well-known/mta-sts.txt
    location = /.well-known/mta-sts.txt {
        default_type text/plain;
        return 200 "version: STSv1
mode: testing
mx: mail.embeddedindia.in
max_age: 604800
";
    }

    # CalDAV and CardDAV discovery
    location = /.well-known/caldav {
        return 301 https://$host/dav/;
    }
    location = /.well-known/carddav {
        return 301 https://$host/dav/;
    }

    # Calendar & contacts sync (CalDAV/CardDAV) for phones and desktop apps.
    # Neutral public path; the backend's own web interface is not exposed.
    location /dav/ {
        proxy_pass http://127.0.0.1:8088/SOGo/dav/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-SOGo-Version;
        proxy_hide_header X-Powered-By;
        client_max_body_size 50M;
        proxy_read_timeout 300s;
    }
    location /SOGo {
        return 404;
    }
    # Sync clients follow absolute hrefs returned by the DAV server
    location ^~ /SOGo/dav/ {
        proxy_pass http://127.0.0.1:8088/SOGo/dav/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;

        # Suppress internal engine headers
        proxy_hide_header X-SOGo-Version;
        proxy_hide_header X-Powered-By;

        # Required proxy buffers for SOGo & Mailcow UI
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;

        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The mail server admin UI and REST API are NOT public (everything else maps into the
    # webmail). The website talks to the API on 127.0.0.1:8088 directly; admins reach the
    # UI through an SSH tunnel:  ssh -L 8443:127.0.0.1:8443 ubuntu@mail.embeddedindia.in
    #   -> https://localhost:8443/admin
    # Embedded India Mail (webmail), served from /rc/ on the mail server
    location / {
        proxy_pass http://127.0.0.1:8088/rc/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_hide_header X-Powered-By;
        proxy_cookie_path /rc/ /;
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        client_max_body_size 30M;
        proxy_read_timeout 300s;
    }

    # Spam-quarantine release/delete links sent in quarantine notification emails,
    # plus the static assets that page needs.
    location ~ ^/(qhandler|css/build|js/build|img|fonts)(/|$) {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;

        # Suppress internal engine headers
        proxy_hide_header X-SOGo-Version;
        proxy_hide_header X-Powered-By;

        # Required proxy buffers for SOGo & Mailcow UI
        proxy_buffer_size 128k;
        proxy_buffers 64 512k;
        proxy_busy_buffers_size 512k;

        client_max_body_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
