# ==============================================================================
# Mailcow Docker Compose Override for /embed_mail
# Binds Web/Proxy containers to 127.0.0.1:8088 so Host Nginx can reverse proxy
# mail.embeddedindia.in alongside the existing website without port collisions.
# ==============================================================================
services:
  nginx-mailcow:
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8443:443"
    restart: always

  sogo-mailcow:
    environment:
      - SOGO_EAS_MAX_ENTRIES=2000
      - SOGO_EXPIRE_SESSION=480
    restart: always

  dovecot-mailcow:
    restart: always

  postfix-mailcow:
    restart: always

  rspamd-mailcow:
    restart: always
