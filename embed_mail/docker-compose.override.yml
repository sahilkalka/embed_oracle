# ==============================================================================
# Mailcow Docker Compose Override for /embed_mail
# Port bindings for nginx-mailcow are managed exclusively in mailcow.conf
# (HTTP_BIND=127.0.0.1, HTTP_PORT=8088, HTTPS_BIND=127.0.0.1, HTTPS_PORT=8443)
# DO NOT add ports here to prevent Docker duplicate port allocation errors.
# ==============================================================================
services:
  nginx-mailcow:
    restart: always

  sogo-mailcow:
    environment:
      - SOGO_EAS_MAX_ENTRIES=2000
      - SOGO_EXPIRE_SESSION=480
    volumes:
      - ./data/conf/sogo/custom-theme.css:/usr/local/lib/GNUstep/SOGo/WebServerResources/css/theme-default.css:z
      - ./data/conf/sogo/outlook-web.js:/usr/local/lib/GNUstep/SOGo/WebServerResources/js/custom-theme.js:z
      - ./data/conf/sogo/custom-fulllogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo-full.svg:z
      - ./data/conf/sogo/custom-shortlogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo-short.svg:z
      - ./data/conf/sogo/custom-fulllogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo-logo.png:z
      - ./data/conf/sogo/custom-shortlogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/logo-full.svg:z
      - ./data/conf/sogo/custom-shortlogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/favicon.ico:z
    restart: always

  dovecot-mailcow:
    restart: always

  postfix-mailcow:
    restart: always

  rspamd-mailcow:
    restart: always

networks:
  mailcow-network:
    enable_ipv6: false
