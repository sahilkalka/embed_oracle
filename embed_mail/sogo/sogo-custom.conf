// ==============================================================================
// SOGo Custom ActiveSync & Webmail Configuration
// Placed in /embed_mail/data/conf/sogo/custom-sogo.conf
// ==============================================================================

{
    // ActiveSync & Push configuration for Outlook, iOS, and Android
    SOGoEASActiveSync = YES;
    SOGoMaximumPingInterval = 3540;
    SOGoMaximumSyncInterval = 3540;
    SOGoInternalSyncInterval = 30;

    // Webmail Defaults
    SOGoLanguage = English;
    SOGoTimeZone = "Asia/Kolkata";
    SOGoFirstDayOfWeek = 1;
    SOGoMailMessageCheck = every_minute;
    SOGoMailReplyPlacement = above;
    SOGoMailSignaturePlacement = below;

    // ActiveSync Push Folders (Mail, Calendar, Contacts)
    SOGoCalendarDefaultRoles = ("PublicViewer");
    SOGoDraftsFolderName = "Drafts";
    SOGoSentFolderName = "Sent";
    SOGoTrashFolderName = "Trash";
    SOGoJunkFolderName = "Junk";

    // Branding & UI
    SOGoPageTitle = "Embedded India Webmail";
    SOGoLoginModule = "Mail";
}
